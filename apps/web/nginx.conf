server {
  listen 80;
  root /usr/share/nginx/html;

  # Hashed assets: cache forever. index.html: never (so a deploy is picked up immediately).
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }
  location / {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy strict-origin-when-cross-origin;
    # camera is needed by the shop POS (badge scan) and employee page; LIFF runs inside LINE's webview.
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()";
    try_files $uri /index.html;
  }
}
