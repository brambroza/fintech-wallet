# Production stack for one GO Along VM (multi-tenant: many factories on one deployment).
#   cp deploy/.env.prod.example deploy/.env.prod   # fill secrets
#   docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env.prod up -d
# Images are built and pushed by Jenkins (see Jenkinsfile); this host only pulls.
name: canteen

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      API_DOMAIN: ${API_DOMAIN}
      APP_DOMAIN: ${APP_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [api, web]

  api:
    image: ${REGISTRY}/canteen-api:${TAG:-latest}
    restart: unless-stopped
    env_file: .env.prod
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://wallet:${POSTGRES_PASSWORD}@db:5432/wallet
      CORS_ORIGIN: https://${APP_DOMAIN}
    depends_on:
      db:
        condition: service_healthy

  web:
    image: ${REGISTRY}/canteen-web:${TAG:-latest}
    restart: unless-stopped

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: wallet
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: wallet
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wallet"]
      interval: 5s
      retries: 10

  # Nightly logical backup, 14 days kept on the host. Copy ./backups off the VM as well (see RUNBOOK).
  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./backups:/backups
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          ts=$$(date +%Y%m%d-%H%M%S)
          pg_dump -h db -U wallet -Fc wallet > /backups/wallet-$$ts.dump && echo "backup ok $$ts"
          find /backups -name 'wallet-*.dump' -mtime +14 -delete
          sleep 86400
        done
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  caddy_data:
  caddy_config:
